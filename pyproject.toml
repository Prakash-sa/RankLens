[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranklens"
version = "1.0.0"
description = "MPI workload observability and performance diagnosis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Prakash Saini"}]
keywords = ["MPI", "HPC", "PMPI", "observability", "performance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.scripts]
ranklens = "ranklens.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
