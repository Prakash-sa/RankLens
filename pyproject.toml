[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranklens"
version = "1.1.0a1"
description = "MPI workload observability and performance diagnosis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Prakash Saini"}]
keywords = ["MPI", "HPC", "PMPI", "observability", "performance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.scripts]
ranklens = "ranklens.cli:main"
ranklens-enterprise-api = "ranklens_enterprise.api:main"
ranklens-enterprise-scheduler = "ranklens_enterprise.scheduler_service:main"
ranklens-enterprise-worker = "ranklens_enterprise.worker:main"

[project.optional-dependencies]
enterprise = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pyarrow>=19,<23",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]
test = ["httpx>=0.28,<1"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
