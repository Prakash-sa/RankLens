name: ranklens-enterprise

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ranklens
      POSTGRES_USER: ranklens
      POSTGRES_PASSWORD: ${RANKLENS_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranklens -d ranklens"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      RANKLENS_DATABASE_URL: postgresql+psycopg://ranklens:${RANKLENS_POSTGRES_PASSWORD:?required}@postgres/ranklens
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      RANKLENS_DATABASE_URL: postgresql+psycopg://ranklens:${RANKLENS_POSTGRES_PASSWORD:?required}@postgres/ranklens
      RANKLENS_OBJECT_ROOT: /var/lib/ranklens/objects
      RANKLENS_MACHINE_TOKENS_JSON: ${RANKLENS_MACHINE_TOKENS_JSON:?required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - object-data:/var/lib/ranklens/objects
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["ranklens-enterprise-worker"]
    environment:
      RANKLENS_DATABASE_URL: postgresql+psycopg://ranklens:${RANKLENS_POSTGRES_PASSWORD:?required}@postgres/ranklens
      RANKLENS_OBJECT_ROOT: /var/lib/ranklens/objects
      RANKLENS_MACHINE_TOKENS_JSON: ${RANKLENS_MACHINE_TOKENS_JSON:?required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - object-data:/var/lib/ranklens/objects
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
